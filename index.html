<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ciencias con Sara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky tab bar + one centred study column; each body system keeps its own colour everywhere */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#1b2232; --muted:#5b6578; --line:#dde3ec;
  --accent:#e0691c; --accent-ink:#ffffff; --accent-soft:#fdeadb;
  --ok:#17915a; --ok-soft:#daf2e5; --bad:#d23a3a; --bad-soft:#fbe1e1;
  --nerv:#3463d1; --bone:#a87a1f; --musc:#c93b36; --repro:#a1438a;
  --plate:#ffffff; --bone-fill:#f3e7cb; --bone-line:#a3824a; --joint-fill:#f5cd8a;
  --skin:#f4dccb; --skin-line:#cfa98f; --musc-fill:#dd6a5e; --musc-line:#9f3a31;
  --brain:#e8a3a8; --cord:#c4865a; --nerve-line:#3c6ee0;
  --rep-fill:#f2aabb; --rep-dark:#d9708c; --rep-line:#a94a67; --ovary:#d6b0e2; --bladder:#f5e6b2; --urethra:#efc23f;
  --pt:#1b2232; --pt-ink:#ffffff; --pt-ring:#e0691c; --tendon:#e6e0d6;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151d; --surface:#1a202b; --ink:#e8ecf3; --muted:#9ba6b9; --line:#2a3241;
  --accent:#f08a3e; --accent-ink:#1a1208; --accent-soft:#3a2617;
  --ok:#3cc283; --ok-soft:#163427; --bad:#f06666; --bad-soft:#3a1c1f;
  --nerv:#7299f2; --bone:#dcae55; --musc:#f2716b; --repro:#da80c3;
  --plate:#1f2633; --bone-line:#c9a463; --skin-line:#b8917a; --pt:#f2f4f8; --pt-ink:#11151d;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202b; --ink:#e8ecf3; --muted:#9ba6b9; --line:#2a3241;
  --accent:#f08a3e; --accent-ink:#1a1208; --accent-soft:#3a2617;
  --ok:#3cc283; --ok-soft:#163427; --bad:#f06666; --bad-soft:#3a1c1f;
  --nerv:#7299f2; --bone:#dcae55; --musc:#f2716b; --repro:#da80c3;
  --plate:#1f2633; --bone-line:#c9a463; --skin-line:#b8917a; --pt:#f2f4f8; --pt-ink:#11151d;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:800}
.brand small{color:var(--muted);font-weight:600}
.logo{width:30px;height:30px;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 12px 10px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--accent)}

main{max-width:960px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.view-head{display:grid;gap:6px}
.view-head h2{font-size:1.7rem}
.view-head p{margin:0;color:var(--muted);max-width:62ch}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--tc,var(--accent));background:var(--tc,var(--accent));color:var(--surface)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .dot{background:var(--surface)}

.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:800}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 11px;font-size:.9rem;border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.say{border:0;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:34px;height:34px;flex:none;display:inline-grid;place-items:center;font-size:1rem;vertical-align:middle}

.trad{display:block;font-family:var(--body);font-size:.85em;font-weight:600;font-style:italic;color:var(--muted);margin-top:2px;line-height:1.35}
.trbtn{margin-left:auto;font-size:.82rem;padding:4px 11px;white-space:nowrap}
@media (max-width:520px){.brand small{display:none}}
.reading .es-block{border-top:1px dashed var(--line);padding-top:10px;margin-top:6px;color:var(--muted);font-style:italic}
/* spelling */
.spell{display:grid;gap:14px;justify-items:center;text-align:center}
.spell .esword{font-family:var(--display);font-size:clamp(2rem,8vw,2.8rem);font-weight:800;color:var(--tc);line-height:1.1}
.spell input{width:min(100%,460px);font:700 clamp(1.6rem,6vw,2.2rem)/1.2 var(--body);text-align:center;padding:14px;border:3px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
.spell input:focus{outline:none;border-color:var(--accent)}
.spell input.ok{border-color:var(--ok);background:var(--ok-soft)} .spell input.bad{border-color:var(--bad);background:var(--bad-soft)}
.letters{font:800 1.6rem/1.3 var(--body);letter-spacing:.06em;display:flex;flex-wrap:wrap;justify-content:center}
.letters span{padding:0 1px;border-radius:4px}
.letters .m{color:var(--ok)} .letters .x{color:var(--bad);background:var(--bad-soft)} .letters .del{color:var(--bad);text-decoration:line-through}
.letters .miss{color:var(--accent);background:var(--accent-soft)}
.cmp{display:grid;gap:4px;justify-items:center}
.cmp small{font-weight:700;color:var(--muted)}
.bigsay{font:800 1.2rem var(--body);border:0;border-radius:999px;padding:14px 26px;background:var(--tc);color:var(--surface)}
.hintline{font:800 1.4rem var(--body);letter-spacing:.25em;color:var(--muted)}
/* explainers */
.glow{filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 2px var(--accent))}
.tendon{stroke:var(--tendon);stroke-width:5;stroke-linecap:round}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.88,1.08)}}
@media (prefers-reduced-motion:reduce){.flick{animation:none}}
.ex-panel{display:grid;gap:12px;align-content:start}
.cap-en{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.6rem);font-weight:700;line-height:1.25;min-height:2.5em}
.ex-steps{margin:0;padding:0;list-style:none;display:grid;gap:4px;counter-reset:e}
.ex-steps li{counter-increment:e}
.ex-steps button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:.88rem;font-weight:600;color:var(--muted)}
.ex-steps button::before{content:counter(e);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-weight:800;font-size:.78rem}
.ex-steps button.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.ex-steps button.cur{background:var(--accent-soft);color:var(--ink)}
.ex-steps button.cur::before{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.slider{display:grid;gap:6px;padding:8px 6px 4px;font-weight:800}
.slider input{width:100%;accent-color:var(--accent);height:28px}
/* home */
.hero{display:grid;gap:10px;padding-block:6px}
.eyebrow{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin:0}
.hero h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
.hero p{margin:0;max-width:60ch;color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.topic{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.topic h3{font-size:1.25rem}
.topic .es{color:var(--muted);font-weight:700;font-size:.9rem;margin-top:-6px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--accent));border-radius:99px}
.pct{font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.steps{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:65ch}

/* flashcards */
.card-wrap{display:grid;justify-items:center;gap:14px}
.flash{width:min(100%,460px);min-height:250px;border-radius:20px;border:2px solid var(--line);border-bottom:8px solid var(--tc);background:var(--surface);padding:24px;display:grid;place-items:center;text-align:center;gap:8px;position:relative}
.flash .word{font-family:var(--display);font-size:clamp(2rem,8vw,2.8rem);font-weight:800;line-height:1.1}
.flash .tr{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--tc)}
.flash .def{color:var(--muted);max-width:36ch}
.flash .hint{position:absolute;bottom:10px;font-size:.8rem;color:var(--muted)}
.flash .say{position:absolute;top:12px;right:12px}
.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

/* diagrams */
.map-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.map-grid{grid-template-columns:1fr}}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow-x:auto}
.plate svg{display:block;width:100%;height:auto;max-height:72vh;margin:0 auto}
.bone{fill:var(--bone-fill);stroke:var(--bone-line);stroke-width:1.5}
.joint{fill:var(--joint-fill);stroke:var(--bone-line);stroke-width:1.5}
.skin{fill:var(--skin);stroke:var(--skin-line);stroke-width:1.5}
.mus{fill:var(--musc-fill);stroke:var(--musc-line);stroke-width:1.2}
.pt{cursor:pointer}
.pt .hit{fill:transparent}
.pt .c{fill:var(--pt);stroke:var(--plate);stroke-width:2.5}
.pt .ring{fill:none;stroke:var(--pt-ring);stroke-width:3;opacity:0}
.pt.hl .ring{opacity:1;animation:pulse 1.2s ease-in-out infinite}
.pt.hl .c{fill:var(--pt-ring)}
.pt.ok .c{fill:var(--ok)} .pt.bad .c{fill:var(--bad)}
.pt:hover .c{fill:var(--accent)}
@keyframes pulse{50%{stroke-width:7;opacity:.5}}
@media (prefers-reduced-motion:reduce){.pt.hl .ring{animation:none}}
.lbl{font-family:var(--body);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--plate);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.ok{fill:var(--ok)} .lbl.bad{fill:var(--bad)}
.prompt{font-family:var(--display);font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prompt em{font-style:normal;color:var(--accent)}
.wordlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.wordlist li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.wordlist li:hover{background:var(--bg)}
.wordlist b{font-weight:800}
.tag{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.7rem);font-weight:700;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:6px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:6px solid var(--bad)}
.grade{font-family:var(--display);font-size:4rem;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.wronglist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.wronglist li{background:var(--bg);border-radius:10px;padding:10px 12px}

/* order */
.seq{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.seq li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:700;counter-increment:s}
.seq li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--surface);background:var(--tc,var(--accent));border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center}
.seq li.ok{background:var(--ok-soft)} .seq li.bad{background:var(--bad-soft)}
.pool{display:grid;gap:8px}
.pool .opt{font-weight:600}

/* reading */
.reading{font-size:1.05rem;max-width:68ch}
.reading p{margin:0 0 10px}
.reading b{color:var(--tc)}
.cq{display:grid;gap:10px}
.cq h3{font-size:1.2rem}
.cq .es{color:var(--muted);font-size:.9rem;margin-top:-6px}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.model{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:.85rem;font-weight:800;border-radius:99px;padding:2px 10px;border:2px solid var(--line);color:var(--muted)}
.key.hit{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
</style>

<header class="top"><div class="top-in">

</div></header>

<script>
/* ============ CONTENT (Science book pp. 29–32) ============ */
const TOPICS = {
  nervous:   {en:"Nervous system",  es:"Sistema nervioso",           tc:"var(--nerv)",  page:"p. 29"},
  locomotor: {en:"Skeletal system", es:"Huesos y articulaciones",    tc:"var(--bone)",  page:"p. 30"},
  muscular:  {en:"Muscular system", es:"Músculos y tendones",        tc:"var(--musc)",  page:"p. 31"},
  repro:     {en:"Reproduction",    es:"Reproducción",               tc:"var(--repro)", page:"p. 32"},
};

// [english, español, definition, topic]
const VOCAB = [
 ["brain","cerebro","It's the boss of our body. When it gets a signal, it sends a message to react.","nervous"],
 ["spinal cord","médula espinal","It connects the brain to the nerves. It's like a motorway.","nervous"],
 ["nerves","nervios","They go from the organs, muscles and skin to the spinal cord.","nervous"],
 ["signal","señal","Information that travels through the nerves.","nervous"],
 ["to react","reaccionar","To respond to something, e.g. moving your hand away from something hot.","nervous"],
 ["voluntary","voluntario","Something we decide to do, like speaking or dancing.","nervous"],
 ["involuntary","involuntario","Something our body does automatically, like the heart pumping or digestion.","nervous"],
 ["locomotor system","aparato locomotor","The skeletal system + the muscular system. It lets us move.","locomotor"],
 ["skeleton","esqueleto","All the bones of the body together.","locomotor"],
 ["bones","huesos","Hard on the outside and like sponges on the inside. We have more than 200.","locomotor"],
 ["joints","articulaciones","They connect our bones and allow us to move our skeleton.","locomotor"],
 ["shape","forma","Bones give shape to our bodies.","locomotor"],
 ["to support","sostener","Bones support our bodies.","locomotor"],
 ["to protect","proteger","Bones protect some of our organs, e.g. the skull protects the brain.","locomotor"],
 ["skull","cráneo","The bone of the head. It protects the brain.","locomotor"],
 ["humerus","húmero","The bone of the upper arm, between the shoulder and the elbow.","locomotor"],
 ["rib cage","caja torácica","The ribs. It protects the heart and the lungs.","locomotor"],
 ["spinal column","columna vertebral","The backbone. It protects the spinal cord.","locomotor"],
 ["pelvis","pelvis","The bone at the hips that connects the spine and the legs.","locomotor"],
 ["radius","radio","A bone of the forearm, between the elbow and the wrist.","locomotor"],
 ["femur","fémur","The thigh bone. It's the largest bone in the human body.","locomotor"],
 ["tibia","tibia","The bone of the lower leg, between the knee and the ankle.","locomotor"],
 ["shoulder","hombro","The joint between the humerus and the body.","locomotor"],
 ["elbow","codo","The joint in the middle of the arm.","locomotor"],
 ["wrist","muñeca","The joint between the arm and the hand.","locomotor"],
 ["hip","cadera","The joint between the pelvis and the femur.","locomotor"],
 ["knee","rodilla","The joint between the femur and the tibia.","locomotor"],
 ["ankle","tobillo","The joint between the leg and the foot.","locomotor"],
 ["stapes","estribo","The smallest bone in the human body. It's in the ear and is about 3 mm long.","locomotor"],
 ["Achilles tendon","tendón de Aquiles","The largest tendon in the body. It's at the back of the ankle.","muscular"],
 ["muscular system","sistema muscular","It follows the brain's commands. It's made up of muscles and tendons.","muscular"],
 ["muscles","músculos","They contract and relax to move the bones.","muscular"],
 ["tendons","tendones","Flexible tissue that connects your muscles to your bones.","muscular"],
 ["to contract","contraer","To get shorter and pull. One muscle contracts and pulls a joint.","muscular"],
 ["to relax","relajar","To get longer and loose again.","muscular"],
 ["elastic","elástico","Muscles are elastic, so they can relax and contract without breaking.","muscular"],
 ["in pairs","en parejas","Muscles work in pairs: one pulls a joint one way, the other pulls it the other way.","muscular"],
 ["trapezius","trapecio","Muscle in the upper back and neck.","muscular"],
 ["deltoid","deltoides","Muscle of the shoulder.","muscular"],
 ["pectoral","pectoral","Muscle of the chest.","muscular"],
 ["biceps","bíceps","Muscle at the front of the upper arm. It bends the elbow.","muscular"],
 ["triceps","tríceps","Muscle at the back of the upper arm. It straightens the elbow.","muscular"],
 ["abdominal","abdominales","Muscles of the belly (tummy).","muscular"],
 ["quadriceps","cuádriceps","Muscle at the front of the thigh. It helps you to walk.","muscular"],
 ["to reproduce","reproducirse","To produce new living things.","repro"],
 ["asexually","asexualmente","The organism produces an identical copy of itself.","repro"],
 ["sexually","sexualmente","Two individuals produce a new organism with a mixture of each parent's genes.","repro"],
 ["genes","genes","Information from the parents that passes to the baby.","repro"],
 ["oviparous","ovíparo","Animals that reproduce by laying eggs (e.g. a turtle).","repro"],
 ["viviparous","vivíparo","Animals that grow inside the mother's body (e.g. a dolphin, humans).","repro"],
 ["ovoviviparous","ovovivíparo","Animals that hatch from eggs inside the mother's body (e.g. a great white shark).","repro"],
 ["pregnancy","embarazo","The time the baby grows inside the mother: nine months in humans.","repro"],
 ["to give birth","dar a luz","When the baby is born.","repro"],
 ["ovaries","ovarios","They produce egg cells. There's one on each side of the uterus.","repro"],
 ["egg cells (ova)","óvulos","The female cells. They are produced in the ovaries.","repro"],
 ["fallopian tubes","trompas de Falopio","They connect the ovaries to the uterus.","repro"],
 ["uterus","útero","The organ where the fertilised egg develops into a fetus.","repro"],
 ["cervix","cuello uterino","It connects the vagina to the uterus.","repro"],

 produce una copia idéntica de sí mismo. En la reproducción sexual dos individuos producen un nuevo organismo con una mezcla de los genes de cada progenitor.", "Oviparous animals lay eggs, like a turtle. Viviparous animals grow inside the mother's body, like a dolphin. Ovoviviparous animals hatch from eggs inside the mother's body, like a great white shark.": "Los ovíparos ponen huevos, como la tortuga. Los vivíparos crecen dentro del cuerpo de la madre, como el delfín. Los ovovivíparos salen de huevos dentro del cuerpo de la madre, como el tiburón blanco.", "The ovaries produce egg cells (ova). The fallopian tubes connect the ovaries to the uterus. The uterus is where the fertilised egg develops into a fetus.": "Los ovarios producen óvulos. Las trompas de Falopio conectan los ovarios con el útero. El útero es donde el óvulo fecundado se convierte en feto.", "The testicles produce sperm cells. They travel through the vas deferens to the seminal vesicles and the prostate, which produce semen. The urethra carries semen out of the body.": "Los testículos producen espermatozoides. Viajan por el conducto deferente hasta las vesículas seminales y la próstata, que producen el semen. La uretra lleva el semen fuera del cuerpo."};

const NS="http://www.w3.org/2000/svg";
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const EX={token:0,i:-1,playing:false,done:false,armA:0};
function tween(d,fn){const tok=EX.token;return new Promise(res=>{const t0=performance.now();const f=now=>{if(tok!==EX.token)return res();const k=Math.min(1,(now-t0)/d);fn(ease(k),k);k<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sayP(t){return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res();}};
  try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;u.onend=fin;u.onerror=fin;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){fin();}
  setTimeout(fin,t.length*85+2500);});}
const setT=(e,x,y,s=1,flip=false,rot=0)=>e.setAttribute("transform",`translate(${x},${y}) rotate(${rot}) scale(${flip?-s:s},${s})`);

function exCtx(instant){
  const svg=$("#exsvg"), fx=svg.querySelector("#x-fx");
  const el=id=>svg.querySelector("#x-"+id);
  const tw=(d,fn)=>instant?(fn(1,1),Promise.resolve()):tween(d,fn);
  const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);fx.appendChild(e);return e;};
  return {instant,el,tw,
    wait:ms=>instant?Promise.resolve():wait(ms),
    show:(id,d=500,to=1)=>{const e=el(id);return tw(d,k=>e.style.opacity=k*to);},
    hide:(id,d=400)=>{const e=el(id);const s=+(e.style.opacity||1);return tw(d,k=>e.style.opacity=s*(1-k));},
    ring(x,y,color="var(--accent)",d=900){if(instant)return Promise.resolve();const r=mk("circle",{cx:x,cy:y,fill:"none",stroke:color,"stroke-width":4});
      return tween(d,(k,raw)=>{r.setAttribute("r",6+raw*28);r.style.opacity=1-raw;}).then(()=>r.remove());},
    glow(id,ms=1400){if(instant)return Promise.resolve();const e=el(id);e.classList.add("glow");return wait(ms).then(()=>e.classList.remove("glow"));},
    travel(pid,{color="var(--nerv)",r=6,d=1600,n=1,gap=220}={}){
      if(instant)return Promise.resolve();
      const p=el(pid),L=p.getTotalLength();
      const tr=mk("path",{d:p.getAttribute("d"),fill:"none",stroke:color,"stroke-width":4,"stroke-linecap":"round",opacity:.45,"stroke-dasharray":L,"stroke-dashoffset":L});
      const dots=[...Array(n)].map(()=>mk("circle",{r,fill:color,stroke:"var(--plate)","stroke-width":1.5,opacity:0}));
      const total=d+gap*(n-1);
      return tween(total,(k,raw)=>{const t=raw*total;tr.setAttribute("stroke-dashoffset",L*(1-Math.min(1,t/d)));
        dots.forEach((dt,i)=>{const kk=Math.max(0,Math.min(1,(t-i*gap)/d));const q=p.getPointAtLength(L*kk);dt.setAttribute("cx",q.x);dt.setAttribute("cy",q.y);dt.setAttribute("opacity",kk>0&&kk<1?1:0);});
      }).then(()=>dots.forEach(x=>x.remove()));},
    along(id,pid,d){const e=el(id),p=el(pid),L=p.getTotalLength();return tw(d,(k,raw)=>{const q=p.getPointAtLength(L*raw);e.setAttribute("transform",`translate(${q.x},${q.y})`);});},
    rows(n){[1,2,3].forEach(i=>{const r=el("row"+i);if(r)r.style.opacity=i===n?1:.3;});},
  };
}

function belly(P,Q,b,side){const dx=Q.x-P.x,dy=Q.y-P.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy*side,ny=ux*side;

  return {P1,Q1,M:{x:M.x+nx*b,y:M.y+ny*b},d:`M${P1.x},${P1.y} Q${M.x+nx*b*2},${M.y+ny*b*2} ${Q1.x},${Q1.y} Q${M.x-nx*b*.5},${M.y-ny*b*.5} ${P1.x},${P1.y} Z`};}
function armUpdate(a,states){
  const svg=$("#exsvg"); if(!svg||!svg.querySelector("#x-fore")) return;
  const g=id=>svg.querySelector("#x-"+id), r=a*Math.PI/180, E={x:150,y:230};
  const rot=(x,y)=>{const dx=x-E.x,dy=y-E.y;return {x:E.x+dx*Math.cos(r)-dy*Math.sin(r),y:E.y+dx*Math.sin(r)+dy*Math.cos(r)};};
  g("fore").setAttribute("transform",`rotate(${a} 150 230)`);
  const bP={x:162,y:84},bQ=rot(162,264),bL=Math.hypot(bQ.x-bP.x,bQ.y-bP.y);
  const B=belly(bP,bQ,11+30*Math.max(0,1-bL/180),-1);
  const tP={x:138,y:84},tQ=rot(136,234),tL=Math.hypot(tQ.x-tP.x,tQ.y-tP.y);
  const T=belly(tP,tQ,13*Math.pow(150/tL,3),1);
  g("bic").setAttribute("d",B.d); g("tri").setAttribute("d",T.d);
  const ln=(id,p,q)=>{const e=g(id);e.setAttribute("x1",p.x);e.setAttribute("y1",p.y);e.setAttribute("x2",q.x);e.setAttribute("y2",q.y);};
  ln("bt1",bP,B.P1); ln("bt2",B.Q1,bQ); ln("tt1",tP,T.P1); ln("tt2",T.Q1,tQ);
  ln("bLine",{x:246,y:122},B.M); ln("tLine",{x:96,y:122},T.M);

  for(const [k,t] of Object.entries(TOPICS)) h+=`<button class="chip" style="--tc:${t.tc}" data-act="${act}" data-arg="${k}" aria-pressed="${active===k}"><span class="dot"></span>${t.en}</button>`;

const MCQ=MC.map(([id,topic,q,a,w,ex])=>({id,type:"mc",topic,q,a,w,ex}));
const PINQ=DIAGRAMS.flatMap(d=>d.points.map(p=>({id:`pin:${d.id}:${p.id}`,type:"pin",topic:d.topic,d:d.id,a:p.id})));

function topicProgress(t){const qs=ALLQ.filter(q=>q.topic===t);const done=qs.filter(q=>store.stats[q.id]?.r>0&&!store.mistakes.includes(q.id)).length;return Math.round(done/qs.length*100);}

function diagramSVG(d,o={}){
  const fs=d.fs, mid=d.w/2;
  let pts="";
  d.points.forEach(p=>{
    const st=(o.marks&&o.marks[p.id])||(o.hl===p.id?"hl":"");
    const showLbl=o.labels||(o.marks&&o.marks[p.id]&&o.reveal);
    pts+=`<g class="pt ${st}" data-act="pt" data-arg="${esc(p.id)}" role="button" tabindex="0" aria-label="${o.labels?esc(p.id):"punto"}"><circle class="hit" cx="${p.x}" cy="${p.y}" r="17"/><circle class="ring" cx="${p.x}" cy="${p.y}" r="12"/><circle class="c" cx="${p.x}" cy="${p.y}" r="7.5"/></g>`;
    if(showLbl){const right=p.x>=mid; pts+=`<text class="lbl ${o.marks&&o.marks[p.id]||""}" x="${right?p.x+13:p.x-13}" y="${p.y+fs*.35}" font-size="${fs}" text-anchor="${right?"start":"end"}">${esc(p.id)}</text>`;}
  });
  return `<svg viewBox="0 0 ${d.w} ${d.h}" role="img" aria-label="${esc(d.title)}">${d.art()}${pts}</svg>`;
}

/* ---- Escribir (spelling) ---- */
const norm=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();
function accepted(en){
  const out=new Set([en]);
  const m=en.match(/^(.*?)\s*\((.*)\)$/); if(m){out.add(m[1]);out.add(m[2]);}
  for(const v of [...out]) if(/^to /.test(v)) out.add(v.slice(3));
  return [...out].map(norm);
}
function mainForm(en){return en.replace(/\s*\(.*\)$/,"").replace(/^to /,"");}
function align(a,b){ // a = typed, b = correct
  const n=a.length,m=b.length,D=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=0;i<=n;i++)D[i][0]=i; for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const ta=[],tb=[];let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){const ok=a[i-1]===b[j-1];ta.unshift([a[i-1],ok?"m":"x"]);tb.unshift([b[j-1],ok?"m":"miss"]);i--;j--;}
    else if(i>0&&D[i][j]===D[i-1][j]+1){ta.unshift([a[i-1],"del"]);i--;}
    else {tb.unshift([b[j-1],"miss"]);j--;}
  }
  return {dist:D[n][m],ta,tb};
}
const letters=arr=>`<div class="letters">${arr.map(([c,k])=>`<span class="${k}">${c===" "?"&nbsp;":esc(c)}</span>`).join("")}</div>`;
function newSpell(review){
  let pool=VOCAB.filter(v=>S.topic==="all"||v[3]===S.topic);
  if(review) pool=VOCAB.filter(v=>store.spellWrong.includes(v[0]));
  const q=shuffle(pool).slice(0,10);
  S.spell={queue:q,i:0,score:0,val:"",state:null,hint:false,tries:0,review:!!review,fails:[]};
}
function viewSpell(){
  if(!S.spell) newSpell();
  const P=S.spell, w=P.queue[P.i], nw=store.spellWrong.length;
  const head=`<div class="view-head"><h2>Escribir en inglés</h2><p>${S.spellMode==="listen"?"Escucha la palabra en inglés y escríbela.":"Lee la palabra en castellano y escríbela en inglés."} Con el lápiz, toca la casilla y escribe: la tablet convierte tu letra en texto (en la Xiaomi, con Gboard en modo escritura a mano). También puedes usar el teclado.</p></div>
   <div class="row"><span class="muted" style="font-weight:700">Modo:</span><button class="chip" data-act="spellMode" data-arg="es" aria-pressed="${S.spellMode==="es"}">🇪🇸 Leo en castellano</button><button class="chip" data-act="spellMode" data-arg="listen" aria-pressed="${S.spellMode==="listen"}">🎧 Dictado en inglés</button></div>
   ${topicChips("spellTopic",S.topic)}${nw?`<div class="row"><button class="btn small" data-act="spellReview">Repasar palabras falladas (${nw})</button></div>`:""}`;
  if(!P.queue.length) return head+`<div class="panel">No hay palabras que repasar. 🎉</div>`;
  if(!w){
    return head+`<section class="panel spell"><p class="eyebrow">Ronda terminada</p><div class="grade">${P.score}/${P.queue.length}</div>
      ${P.fails.length?`<div><b>Repasa:</b> ${P.fails.map(f=>`<span class="key" style="margin:2px">${esc(f[1])} → <b>${esc(mainForm(f[0]))}</b></span>`).join(" ")}</div>`:"<b>¡Todas bien escritas! 🌟</b>"}
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="spellAgain">Otra ronda</button></div></section>`;
  }
  const [en,es,def,tp]=w, tc=TOPICS[tp].tc, target=mainForm(en);
  let fb="";
  if(P.state==="ok") fb=`<div class="fb ok" style="width:min(100%,460px)">¡Perfecto! <b>${esc(en)}</b> ${sayBtn(en)}</div>`;
  if(P.state==="bad"){
    const al=align(norm(P.val),norm(target));
    fb=`<div class="fb bad" style="width:min(100%,460px)">${al.dist===1?"¡Casi! Solo falla una letra.":"No está bien escrita."} ${P.tries<2?"Inténtalo otra vez o mira la solución.":""}</div>
      <div class="cmp"><small>Tú escribiste</small>${letters(al.ta)}</div>
      ${P.tries>=2||P.show?`<div class="cmp"><small>Correcto</small>${letters(al.tb)} ${sayBtn(en)}</div>`:""}`;
  }
  const done=P.state==="ok"||P.show;
  return head+`<section class="panel spell" style="--tc:${tc}">
    <div class="count">${P.i+1} / ${P.queue.length} · ✓ ${P.score}</div>
    ${S.spellMode==="listen"
      ? `<div class="row" style="justify-content:center"><button class="bigsay" data-act="spellSay" data-arg="1">🔊 Escuchar</button><button class="btn" data-act="spellSay" data-arg="slow">🐢 Más despacio</button></div>
         ${done?`<div class="esword">${esc(en)}</div><div class="muted" style="font-weight:700">${esc(es)}</div>`:""}`
      : `<div class="esword">${esc(es)}</div>`}
    <div class="muted" style="font-weight:700">${TOPICS[tp].en}</div>
    ${P.hint?`<div class="hintline">${target.split("").map((c,k)=>c===" "?"&nbsp;&nbsp;":k===0?esc(c):"_").join(" ")}</div><div class="muted" style="max-width:40ch">${esc(def)}</div>`:""}
    <input id="spell-in" type="text" value="${esc(P.val)}" class="${P.state||""}" placeholder="Write in English…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" ${done?"readonly":""} aria-label="Escribe la palabra en inglés">
    ${fb}
    <div class="row" style="justify-content:center">
      ${done?`<button class="btn primary" data-act="spellNext">Siguiente →</button>`:`
      ${!P.hint?`<button class="btn" data-act="spellHint">💡 Pista</button>`:""}
      <button class="btn primary" data-act="spellCheck">Comprobar</button>
      ${P.state==="bad"?`<button class="btn" data-act="spellShow">Ver solución</button>`:""}`}
    </div></section>`;
}
function spellResult(ok){
  // Only the first attempt counts for the score and the review list
  const P=S.spell,w=P.queue[P.i],en=w[0],set=new Set(store.spellWrong);
  if(P.tries!==1) return;
  if(ok){P.score++; if(!P.hint) set.delete(en);}
  else {set.add(en); P.fails.push([en,w[1]]);}
  store.spellWrong=[...set]; save();
}

function startQuiz(mode){
  let items;
  if(mode==="exam") items=shuffle([...shuffle(MCQ).slice(0,14),...shuffle(PINQ).slice(0,6)]);
  else if(mode==="review") items=shuffle(store.mistakes.map(id=>byId[id]).filter(Boolean));
  else items=shuffle(MCQ.filter(q=>S.topic==="all"||q.topic===S.topic)).slice(0,12);
  items=items.map(q=>q.type==="mc"?{...q,opts:shuffle([q.a,...q.w])}:q);
  S.quiz={mode,items,i:0,score:0,answered:false,pick:null,wrong:[]};
  S.view="quizrun";
}

      <div class="row"><button class="btn primary" data-act="quizAgain">Repetir</button>${store.mistakes.length?`<button class="btn" data-act="review">Repasar mis fallos (${store.mistakes.length})</button>`:""}<button class="btn" data-act="go" data-arg="home">Inicio</button></div></section>`;
  }
  const t=TOPICS[q.topic];
  const head=`<div class="qhead"><span class="count">Pregunta ${Q.i+1} / ${Q.items.length} · ✓ ${Q.score}</span><span class="tag" style="color:${t.tc}">${t.en}</span></div><div class="bar" style="--tc:${t.tc}"><i style="width:${Q.i/Q.items.length*100}%"></i></div>`;
  const fb=Q.answered?`<div class="fb ${Q.lastOk?"ok":"bad"}">${Q.lastOk?"¡Correcto! ":`La respuesta es <b>${esc(q.a)}</b>. `}${q.ex?esc(q.ex):""}${q.ex?T(q.ex):""}</div><div><button class="btn primary" data-act="quizNext">${Q.i+1<Q.items.length?"Siguiente →":"Ver nota"}</button></div>`:"";
  if(q.type==="pin"){
    const d=DIAGRAMS.find(x=>x.id===q.d);
    const marks=Q.answered?{[q.a]:"ok",...(Q.pick&&Q.pick!==q.a?{[Q.pick]:"bad"}:{})}:{};
    return `<section style="display:grid;gap:14px">${head}<div class="prompt">Toca en el dibujo: <em>${esc(q.a)}</em> ${sayBtn(q.a)}</div>${S.tr?`<div class="muted" style="margin-top:-8px">(${esc(ES_PT[q.a]||"")})</div>`:""}
      <div class="map-grid"><div class="plate">${diagramSVG(d,{marks,reveal:true})}</div><div style="display:grid;gap:12px;align-content:start">${fb}</div></div></section>`;
  }
  return `<section class="panel" style="display:grid;gap:14px">${head}
    <div class="qtext">${esc(q.q)}${T(q.q)}</div>
    <div class="opts">${q.opts.map(o=>{let cl="";if(Q.answered){if(o===q.a)cl="ok";else if(o===Q.pick)cl="bad";}return `<button class="opt ${cl}" data-act="qPick" data-arg="${esc(o)}" ${Q.answered?"disabled":""}>${esc(o)}${T(o)}</button>`;}).join("")}</div>${fb}</section>`;
}

function newOrder(i){const s=SEQS[i]; S.order={i,pool:shuffle(s.steps.map((_,k)=>k)),picked:[],checked:false};}
function viewOrder(){
  if(!S.order.pool) newOrder(S.order.i||0);
  const O=S.order, s=SEQS[O.i], tc=TOPICS[s.topic].tc;
  const chips=`<div class="chips">${SEQS.map((x,i)=>`<button class="chip" style="--tc:${TOPICS[x.topic].tc}" data-act="seq" data-arg="${i}" aria-pressed="${i===O.i}"><span class="dot"></span>${x.title}</button>`).join("")}</div>`;
  const allOk=O.checked&&O.picked.every((k,i)=>k===i);
  const left=O.pool.filter(k=>!O.picked.includes(k));
  return `<div class="view-head"><h2>Ordenar</h2><p>Toca los pasos en el orden correcto. Si te equivocas, pulsa <b>Quitar el último</b>.</p></div>${chips}
   <section class="panel" style="display:grid;gap:14px;--tc:${tc}">
    <div><h3 style="font-size:1.3rem">${esc(s.title)}</h3><div class="muted">${esc(s.es)}</div></div>
    ${O.picked.length?`<ol class="seq">${O.picked.map((k,i)=>`<li class="${O.checked?(k===i?"ok":"bad"):""}"><span>${esc(s.steps[k])}${T(s.steps[k])}</span></li>`).join("")}</ol>`:`<p class="muted" style="margin:0">Todavía no has elegido ningún paso.</p>`}
    ${left.length?`<div class="pool">${left.map(k=>`<button class="opt" data-act="ordPick" data-arg="${k}">${esc(s.steps[k])}${T(s.steps[k])}</button>`).join("")}</div>`:""}
    ${O.checked?`<div class="fb ${allOk?"ok":"bad"}">${allOk?"¡Perfecto! Orden correcto.":`Casi. El orden correcto es:<ol style="margin:6px 0 0;padding-left:1.3em">${s.steps.map(x=>`<li>${esc(x)}${T(x)}</li>`).join("")}</ol>`}</div>`:""}
    <div class="row">${O.picked.length&&!O.checked?`<button class="btn" data-act="ordUndo">↩ Quitar el último</button>`:""}${!left.length&&!O.checked?`<button class="btn primary" data-act="ordCheck">Comprobar</button>`:""}${O.checked?`<button class="btn primary" data-act="seq" data-arg="${O.i}">Otra vez</button>`:""}</div>
   </section>`;
}

function viewRead(){
  const t=S.topic==="all"?"nervous":S.topic, TP=TOPICS[t];
  return `<div class="view-head"><h2>Comprensión</h2><p>Lee el resumen del libro. Después escribe tu respuesta y compárala con la respuesta modelo: se marcan en verde las palabras clave que has usado.</p></div>
   ${topicChips("readTopic",t,false)}
   <section class="panel reading" style="--tc:${TP.tc}"><p class="eyebrow" style="color:${TP.tc}">${TP.en} · ${TP.page}</p>${READ[t]}${S.tr?`<div class="es-block"><p class="eyebrow" style="color:var(--muted)">Traducción</p>${READ_ES[t]}</div>`:""}</section>
   ${COMP.filter(c=>c.topic===t).map(c=>{
     const draft=S.drafts[c.id]||"", open=S.revealed[c.id], low=draft.toLowerCase();
     return `<section class="panel cq"><h3>${esc(c.q)}</h3>${S.tr?`<div class="es">${esc(c.es)}</div>`:""}
       <textarea id="ans-${c.id}" data-draft="${c.id}" placeholder="Write your answer in English…">${esc(draft)}</textarea>
       <div class="row"><button class="btn ${open?"":"primary"}" data-act="reveal" data-arg="${c.id}">${open?"Ocultar respuesta":"Ver respuesta modelo"}</button>${open?sayBtn(c.model):""}</div>
       ${open?`<div class="model">${esc(c.model)}${T(c.model)}</div><div><div class="muted" style="font-weight:700;margin-bottom:6px">Palabras clave${draft?" (verde = la has usado)":""}:</div><div class="keys">${c.keys.map(k=>`<span class="key ${draft&&low.includes(k.toLowerCase())?"hit":""}">${esc(k)}</span>`).join("")}</div></div>`:""}
     </section>`;}).join("")}`;
}

function render(){
  renderTabs();
  const v={explain:viewExplain,home:viewHome,spell:viewSpell,cards:viewCards,map:viewMap,quiz:viewQuiz,quizrun:viewQuizRun,order:viewOrder,read:viewRead}[S.view];
  $("#app").innerHTML=v();
  if(S.view==="explain"){exStop();EX.i=-1;EX.done=false;exBuild();exPanel();}
}

/* ============ ACTIONS ============ */
const ACT={
  go(a){exStop(); S.view=a; if(a==="map"){S.map.run=null;} render(); window.scrollTo(0,0); if(a==="spell") speakSpell();},
  goTopic(a){exStop(); const [v,t]=a.split("|"); S.topic=t;
    if(v==="explain") S.ex=EXPL.find(x=>x.topic===t).id;
    if(v==="cards") newDeck();
    if(v==="map"){S.map.d=DIAGRAMS.find(d=>d.topic===t).id;S.map.mode="study";S.map.run=null;}
    if(v==="quiz"){startQuiz("normal"); render(); window.scrollTo(0,0); return;}
    S.view=v; render(); window.scrollTo(0,0);},
  say(a){say(a);},
  exam(){startQuiz("exam"); render(); window.scrollTo(0,0);},
  review(){startQuiz("review"); render(); window.scrollTo(0,0);},
  cardsTopic(a){S.topic=a; newDeck(); render();},
  dir(a){S.cardDir=a; S.cards.flip=false; render();},
  flip(){S.cards.flip=!S.cards.flip; render();},
  again(){const c=S.cards,x=c.queue.shift(); c.queue.splice(Math.min(3,c.queue.length),0,x); c.flip=false; render();},
  know(){const c=S.cards,x=c.queue.shift(); c.done++; c.flip=false; if(!store.known.includes(x[0])){store.known.push(x[0]);save();} render();},
  diag(a){S.map.d=a; S.map.run=null; S.map.sel=null; render();},
  mode(a){S.map.mode=a; S.map.run=null; S.map.sel=null; render();},
  mapAgain(){S.map.run=null; render();},
  mapNext(){const R=S.map.run; R.i++; R.answered=false; R.opts=null; R.pick=null; render();},
  pt(a){
    if(S.view==="map"){
      const M=S.map;
      if(M.mode==="study"){M.sel=a; say(a); render(); return;}
      if(M.mode!=="find") return;
      const R=M.run, target=R.order[R.i]; if(!target||R.answered) return;
      const ok=a===target; record(`pin:${M.d}:${target}`,ok);
      R.answered=true; R.lastOk=ok; if(ok){R.score++;R.marks[target]="ok";} else {R.marks[target]="bad";}
      if(ok){render(); setTimeout(()=>{if(S.map.run===R&&R.answered){ACT.mapNext();}},650); return;}
      render(); return;
    }
    if(S.view==="quizrun"){const Q=S.quiz,q=Q.items[Q.i]; if(!q||q.type!=="pin"||Q.answered) return; answer(a);}
  },
  mapPick(a){const R=S.map.run,target=R.order[R.i]; if(R.answered) return; const ok=a===target; record(`pin:${S.map.d}:${target}`,ok);
    R.answered=true; R.lastOk=ok; R.pick=a; if(ok)R.score++; R.marks[target]=ok?"ok":"bad"; render();},
  quizTopic(a){S.topic=a; render();},
  quizStart(){startQuiz("normal"); render(); window.scrollTo(0,0);},
  quizAgain(){startQuiz(S.quiz.mode); render(); window.scrollTo(0,0);},
  qPick(a){answer(a);},
  quizNext(){const Q=S.quiz; Q.i++; Q.answered=false; Q.pick=null; render(); window.scrollTo(0,0);},
  seq(a){newOrder(+a); render();},
  ordPick(a){S.order.picked.push(+a); render();},
  ordUndo(){S.order.picked.pop(); render();},
  ordCheck(){S.order.checked=true; render();},
  tr(){S.tr=!S.tr; store.tr=S.tr; save(); render();},
  spellTopic(a){S.topic=a; newSpell(); render(); speakSpell();},
  spellMode(a){S.spellMode=a; store.spellMode=a; save(); newSpell(); render(); speakSpell();},
  spellSay(a){const w=S.spell.queue[S.spell.i]; if(w) say(mainForm(w[0]),a==="slow"?.5:.85); focusSpell();},
  spellReview(){newSpell(true); render(); speakSpell();},
  spellAgain(){newSpell(S.spell.review); render(); speakSpell();},
  spellHint(){S.spell.hint=true; render(); focusSpell();},
  spellCheck(){const P=S.spell; const inp=$("#spell-in"); if(inp) P.val=inp.value; if(!norm(P.val)) {focusSpell(); return;}
    const w=P.queue[P.i]; P.tries++; const ok=accepted(w[0]).includes(norm(P.val));
    P.state=ok?"ok":"bad"; spellResult(ok); if(ok) say(w[0]); render(); if(!ok) focusSpell();},
  spellShow(){S.spell.show=true; say(S.spell.queue[S.spell.i][0]); render();},
  spellNext(){const P=S.spell; P.i++; P.val=""; P.state=null; P.hint=false; P.tries=0; P.show=false; render(); focusSpell(); speakSpell();},
  exPick(a){S.ex=a; render();},
  exPlay(){const X=curEx();
    if(EX.playing){exStop(); exPanel(); return;}
    EX.playing=true;
    const n=X.steps.length; let i=EX.i<0?0:EX.done?EX.i+1:EX.i; if(i>=n) i=0;
    exGo(i);},
  exNext(){EX.playing=false; exGo(Math.min(curEx().steps.length-1,EX.i+1));},
  exPrev(){EX.playing=false; exGo(Math.max(0,EX.i-1));},
  exStep(a){EX.playing=false; exGo(+a);},
  exNarr(){S.narr=!S.narr; store.narr=S.narr; save(); if(!S.narr){try{speechSynthesis.cancel();}catch(e){}} exPanel();},
  readTopic(a){S.topic=a; render();},
  reveal(a){S.revealed[a]=!S.revealed[a]; render();},
};
function speakSpell(){const P=S.spell; if(S.view==="spell"&&S.spellMode==="listen"&&P&&P.queue[P.i]) say(mainForm(P.queue[P.i][0]));}
function focusSpell(){const i=$("#spell-in"); if(i&&!i.readOnly){i.focus(); const n=i.value.length; try{i.setSelectionRange(n,n);}catch(e){}}}
function answer(a){
  const Q=S.quiz,q=Q.items[Q.i]; if(Q.answered) return;
  const ok=a===q.a; Q.answered=true; Q.pick=a; Q.lastOk=ok; record(q.id,ok);
  if(ok) Q.score++; else Q.wrong.push(q);
  render();
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]"); if(!t) return; ACT[t.dataset.act]?.(t.dataset.arg,t,e);});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click?e.target.click():ACT[e.target.dataset.act]?.(e.target.dataset.arg);}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="spell-in"){e.preventDefault(); if(!e.target.readOnly) ACT.spellCheck(); else ACT.spellNext();}});
document.addEventListener("input",e=>{if(e.target.id==="armRange"){if(EX.playing||EX.i>=0&&!EX.done)exStop(); const a=-(+e.target.value); const bending=a<EX.armA; armUpdate(a,a===EX.armA?null:bending?["c","r"]:["r","c"]); exPanel(); return;}
if(e.target.id==="spell-in"&&S.spell){S.spell.val=e.target.value; if(S.spell.state==="bad"){S.spell.state=null; e.target.className="";}}
const id=e.target.dataset&&e.target.dataset.draft; if(id) S.drafts[id]=e.target.value;});
render();
</script>
<!--APP-END-->
</html>
