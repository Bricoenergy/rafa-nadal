<title>Ciencias con Sara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky tab bar + one centred study column; each body system keeps its own colour everywhere */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#1b2232; --muted:#5b6578; --line:#dde3ec;
  --accent:#e0691c; --accent-ink:#ffffff; --accent-soft:#fdeadb;
  --ok:#17915a; --ok-soft:#daf2e5; --bad:#d23a3a; --bad-soft:#fbe1e1;
  --nerv:#3463d1; --bone:#a87a1f; --musc:#c93b36; --repro:#a1438a;
  --plate:#ffffff; --bone-fill:#f3e7cb; --bone-line:#a3824a; --joint-fill:#f5cd8a;
  --skin:#f4dccb; --skin-line:#cfa98f; --musc-fill:#dd6a5e; --musc-line:#9f3a31;
  --brain:#e8a3a8; --cord:#c4865a; --nerve-line:#3c6ee0;
  --rep-fill:#f2aabb; --rep-dark:#d9708c; --rep-line:#a94a67; --ovary:#d6b0e2; --bladder:#f5e6b2; --urethra:#efc23f;
  --pt:#1b2232; --pt-ink:#ffffff; --pt-ring:#e0691c;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151d; --surface:#1a202b; --ink:#e8ecf3; --muted:#9ba6b9; --line:#2a3241;
  --accent:#f08a3e; --accent-ink:#1a1208; --accent-soft:#3a2617;
  --ok:#3cc283; --ok-soft:#163427; --bad:#f06666; --bad-soft:#3a1c1f;
  --nerv:#7299f2; --bone:#dcae55; --musc:#f2716b; --repro:#da80c3;
  --plate:#1f2633; --bone-line:#c9a463; --skin-line:#b8917a; --pt:#f2f4f8; --pt-ink:#11151d;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202b; --ink:#e8ecf3; --muted:#9ba6b9; --line:#2a3241;
  --accent:#f08a3e; --accent-ink:#1a1208; --accent-soft:#3a2617;
  --ok:#3cc283; --ok-soft:#163427; --bad:#f06666; --bad-soft:#3a1c1f;
  --nerv:#7299f2; --bone:#dcae55; --musc:#f2716b; --repro:#da80c3;
  --plate:#1f2633; --bone-line:#c9a463; --skin-line:#b8917a; --pt:#f2f4f8; --pt-ink:#11151d;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:800}
.brand small{color:var(--muted);font-weight:600}
.logo{width:30px;height:30px;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 12px 10px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-current="true"]{color:var(--accent);border-color:var(--accent)}

main{max-width:960px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.view-head{display:grid;gap:6px}
.view-head h2{font-size:1.7rem}
.view-head p{margin:0;color:var(--muted);max-width:62ch}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--tc,var(--accent));background:var(--tc,var(--accent));color:var(--surface)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .dot{background:var(--surface)}

.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:800}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 11px;font-size:.9rem;border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.say{border:0;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:34px;height:34px;flex:none;display:inline-grid;place-items:center;font-size:1rem;vertical-align:middle}

/* home */
.hero{display:grid;gap:10px;padding-block:6px}
.eyebrow{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin:0}
.hero h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
.hero p{margin:0;max-width:60ch;color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.topic{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.topic h3{font-size:1.25rem}
.topic .es{color:var(--muted);font-weight:700;font-size:.9rem;margin-top:-6px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--accent));border-radius:99px}
.pct{font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.steps{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:65ch}

/* flashcards */
.card-wrap{display:grid;justify-items:center;gap:14px}
.flash{width:min(100%,460px);min-height:250px;border-radius:20px;border:2px solid var(--line);border-bottom:8px solid var(--tc);background:var(--surface);padding:24px;display:grid;place-items:center;text-align:center;gap:8px;position:relative}
.flash .word{font-family:var(--display);font-size:clamp(2rem,8vw,2.8rem);font-weight:800;line-height:1.1}
.flash .tr{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--tc)}
.flash .def{color:var(--muted);max-width:36ch}
.flash .hint{position:absolute;bottom:10px;font-size:.8rem;color:var(--muted)}
.flash .say{position:absolute;top:12px;right:12px}
.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

/* diagrams */
.map-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.map-grid{grid-template-columns:1fr}}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow-x:auto}
.plate svg{display:block;width:100%;height:auto;max-height:72vh;margin:0 auto}
.bone{fill:var(--bone-fill);stroke:var(--bone-line);stroke-width:1.5}
.joint{fill:var(--joint-fill);stroke:var(--bone-line);stroke-width:1.5}
.skin{fill:var(--skin);stroke:var(--skin-line);stroke-width:1.5}
.mus{fill:var(--musc-fill);stroke:var(--musc-line);stroke-width:1.2}
.pt{cursor:pointer}
.pt .hit{fill:transparent}
.pt .c{fill:var(--pt);stroke:var(--plate);stroke-width:2.5}
.pt .ring{fill:none;stroke:var(--pt-ring);stroke-width:3;opacity:0}
.pt.hl .ring{opacity:1;animation:pulse 1.2s ease-in-out infinite}
.pt.hl .c{fill:var(--pt-ring)}
.pt.ok .c{fill:var(--ok)} .pt.bad .c{fill:var(--bad)}
.pt:hover .c{fill:var(--accent)}
@keyframes pulse{50%{stroke-width:7;opacity:.5}}
@media (prefers-reduced-motion:reduce){.pt.hl .ring{animation:none}}
.lbl{font-family:var(--body);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--plate);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.ok{fill:var(--ok)} .lbl.bad{fill:var(--bad)}
.prompt{font-family:var(--display);font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prompt em{font-style:normal;color:var(--accent)}
.wordlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.wordlist li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.wordlist li:hover{background:var(--bg)}
.wordlist b{font-weight:800}
.tag{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.7rem);font-weight:700;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:6px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:6px solid var(--bad)}
.grade{font-family:var(--display);font-size:4rem;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.wronglist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.wronglist li{background:var(--bg);border-radius:10px;padding:10px 12px}

/* order */
.seq{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.seq li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:700;counter-increment:s}
.seq li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--surface);background:var(--tc,var(--accent));border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center}
.seq li.ok{background:var(--ok-soft)} .seq li.bad{background:var(--bad-soft)}
.pool{display:grid;gap:8px}
.pool .opt{font-weight:600}

/* reading */
.reading{font-size:1.05rem;max-width:68ch}
.reading p{margin:0 0 10px}
.reading b{color:var(--tc)}
.cq{display:grid;gap:10px}
.cq h3{font-size:1.2rem}
.cq .es{color:var(--muted);font-size:.9rem;margin-top:-6px}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.model{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:.85rem;font-weight:800;border-radius:99px;padding:2px 10px;border:2px solid var(--line);color:var(--muted)}
.key.hit{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
</style>

const MX = (x,w) => w - x;
function bone(x1,y1,x2,y2,w){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--bone-line)" stroke-width="${w+3}" stroke-linecap="round"/>`+
         `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--bone-fill)" stroke-width="${w}" stroke-linecap="round"/>`;
}
function both(fn, W){ return fn(x=>x) + fn(x=>MX(x,W)); }

function diagramSVG(d,o={}){
  const fs=d.fs, mid=d.w/2;
  let pts="";
  d.points.forEach(p=>{
    const st=(o.marks&&o.marks[p.id])||(o.hl===p.id?"hl":"");
    const showLbl=o.labels||(o.marks&&o.marks[p.id]&&o.reveal);
    pts+=`<g class="pt ${st}" data-act="pt" data-arg="${esc(p.id)}" role="button" tabindex="0" aria-label="${o.labels?esc(p.id):"punto"}"><circle class="hit" cx="${p.x}" cy="${p.y}" r="17"/><circle class="ring" cx="${p.x}" cy="${p.y}" r="12"/><circle class="c" cx="${p.x}" cy="${p.y}" r="7.5"/></g>`;
    if(showLbl){const right=p.x>=mid; pts+=`<text class="lbl ${o.marks&&o.marks[p.id]||""}" x="${right?p.x+13:p.x-13}" y="${p.y+fs*.35}" font-size="${fs}" text-anchor="${right?"start":"end"}">${esc(p.id)}</text>`;}
  });
  return `<svg viewBox="0 0 ${d.w} ${d.h}" role="img" aria-label="${esc(d.title)}">${d.art()}${pts}</svg>`;
}

  items=items.map(q=>q.type==="mc"?{...q,opts:shuffle([q.a,...q.w])}:q);

}

function viewQuizRun(){
  const Q=S.quiz, q=Q.items[Q.i];
  if(!Q.items.length) return `<div class="panel"><h3>No hay fallos que repasar 🎉</h3><p class="muted">¡Muy bien! Haz un test para seguir practicando.</p><button class="btn primary" data-act="go" data-arg="quiz">Volver</button></div>`;
  if(!q){
    const grade=Math.round(Q.score/Q.items.length*100)/10;
    const msg=grade>=9?"¡Excelente! 🌟":grade>=7?"¡Muy bien! 👏":grade>=5?"Aprobado. Repasa los fallos y vuelve a intentarlo.":"Toca repasar. ¡Tú puedes!";
    return `<section class="panel" style="display:grid;gap:12px">
      <p class="eyebrow">${Q.mode==="exam"?"Examen de prueba":Q.mode==="review"?"Repaso de fallos":"Test"}</p>
      <div class="row" style="gap:18px"><div class="grade">${String(grade).replace(".",",")}</div><div><b style="font-size:1.2rem">${msg}</b><div class="muted">${Q.score} de ${Q.items.length} correctas</div></div></div>
      ${Q.wrong.length?`<h3 style="font-size:1.15rem">Repasa esto:</h3><ul class="wronglist">${Q.wrong.map(w=>`<li>${w.type==="pin"?`Dibujo <b>${esc(DIAGRAMS.find(d=>d.id===w.d).title)}</b>: ¿dónde está <b>${esc(w.a)}</b>?`:esc(w.q)}<br><span style="color:var(--ok);font-weight:800">✓ ${esc(w.a)}</span>${w.ex?` <span class="muted">· ${esc(w.ex)}</span>`:""}</li>`).join("")}</ul>`:""}
      <div class="row"><button class="btn primary" data-act="quizAgain">Repetir</button>${store.mistakes.length?`<button class="btn" data-act="review">Repasar mis fallos (${store.mistakes.length})</button>`:""}<button class="btn" data-act="go" data-arg="home">Inicio</button></div></section>`;
  }
  const t=TOPICS[q.topic];
  const head=`<div class="qhead"><span class="count">Pregunta ${Q.i+1} / ${Q.items.length} · ✓ ${Q.score}</span><span class="tag" style="color:${t.tc}">${t.en}</span></div><div class="bar" style="--tc:${t.tc}"><i style="width:${Q.i/Q.items.length*100}%"></i></div>`;
  const fb=Q.answered?`<div class="fb ${Q.lastOk?"ok":"bad"}">${Q.lastOk?"¡Correcto! ":`La respuesta es <b>${esc(q.a)}</b>. `}${q.ex?esc(q.ex):""}</div><div><button class="btn primary" data-act="quizNext">${Q.i+1<Q.items.length?"Siguiente →":"Ver nota"}</button></div>`:"";
  if(q.type==="pin"){
    const d=DIAGRAMS.find(x=>x.id===q.d);

    return `<section style="display:grid;gap:14px">${head}<div class="prompt">Toca en el dibujo: <em>${esc(q.a)}</em> ${sayBtn(q.a)}</div>
      <div class="map-grid"><div class="plate">${diagramSVG(d,{marks,reveal:true})}</div><div style="display:grid;gap:12px;align-content:start">${fb}</div></div></section>`;
  }
  return `<section class="panel" style="display:grid;gap:14px">${head}
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map(o=>{let cl="";if(Q.answered){if(o===q.a)cl="ok";else if(o===Q.pick)cl="bad";}return `<button class="opt ${cl}" data-act="qPick" data-arg="${esc(o)}" ${Q.answered?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>${fb}</section>`;
}

function newOrder(i){const s=SEQS[i]; S.order={i,pool:shuffle(s.steps.map((_,k)=>k)),picked:[],checked:false};}
function viewOrder(){
  if(!S.order.pool) newOrder(S.order.i||0);
  const O=S.order, s=SEQS[O.i], tc=TOPICS[s.topic].tc;
  const chips=`<div class="chips">${SEQS.map((x,i)=>`<button class="chip" style="--tc:${TOPICS[x.topic].tc}" data-act="seq" data-arg="${i}" aria-pressed="${i===O.i}"><span class="dot"></span>${x.title}</button>`).join("")}</div>`;
  const allOk=O.checked&&O.picked.every((k,i)=>k===i);
  const left=O.pool.filter(k=>!O.picked.includes(k));
  return `<div class="view-head"><h2>Ordenar</h2><p>Toca los pasos en el orden correcto. Si te equivocas, pulsa <b>Quitar el último</b>.</p></div>${chips}
   <section class="panel" style="display:grid;gap:14px;--tc:${tc}">
    <div><h3 style="font-size:1.3rem">${esc(s.title)}</h3><div class="muted">${esc(s.es)}</div></div>
    ${O.picked.length?`<ol class="seq">${O.picked.map((k,i)=>`<li class="${O.checked?(k===i?"ok":"bad"):""}">${esc(s.steps[k])}</li>`).join("")}</ol>`:`<p class="muted" style="margin:0">Todavía no has elegido ningún paso.</p>`}
    ${left.length?`<div class="pool">${left.map(k=>`<button class="opt" data-act="ordPick" data-arg="${k}">${esc(s.steps[k])}</button>`).join("")}</div>`:""}
    ${O.checked?`<div class="fb ${allOk?"ok":"bad"}">${allOk?"¡Perfecto! Orden correcto.":`Casi. El orden correcto es:<ol style="margin:6px 0 0;padding-left:1.3em">${s.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`}</div>`:""}
    <div class="row">${O.picked.length&&!O.checked?`<button class="btn" data-act="ordUndo">↩ Quitar el último</button>`:""}${!left.length&&!O.checked?`<button class="btn primary" data-act="ordCheck">Comprobar</button>`:""}${O.checked?`<button class="btn primary" data-act="seq" data-arg="${O.i}">Otra vez</button>`:""}</div>
   </section>`;
}

function viewRead(){
  const t=S.topic==="all"?"nervous":S.topic, T=TOPICS[t];
  return `<div class="view-head"><h2>Comprensión</h2><p>Lee el resumen del libro. Después escribe tu respuesta y compárala con la respuesta modelo: se marcan en verde las palabras clave que has usado.</p></div>
   ${topicChips("readTopic",t,false)}
   <section class="panel reading" style="--tc:${T.tc}"><p class="eyebrow" style="color:${T.tc}">${T.en} · ${T.page}</p>${READ[t]}</section>
   ${COMP.filter(c=>c.topic===t).map(c=>{
     const draft=S.drafts[c.id]||"", open=S.revealed[c.id], low=draft.toLowerCase();
     return `<section class="panel cq"><h3>${esc(c.q)}</h3><div class="es">${esc(c.es)}</div>
       <textarea id="ans-${c.id}" data-draft="${c.id}" placeholder="Write your answer in English…">${esc(draft)}</textarea>
       <div class="row"><button class="btn ${open?"":"primary"}" data-act="reveal" data-arg="${c.id}">${open?"Ocultar respuesta":"Ver respuesta modelo"}</button>${open?sayBtn(c.model):""}</div>
       ${open?`<div class="model">${esc(c.model)}</div><div><div class="muted" style="font-weight:700;margin-bottom:6px">Palabras clave${draft?" (verde = la has usado)":""}:</div><div class="keys">${c.keys.map(k=>`<span class="key ${draft&&low.includes(k.toLowerCase())?"hit":""}">${esc(k)}</span>`).join("")}</div></div>`:""}
     </section>`;}).join("")}`;
}

function render(){
  renderTabs();
  const v={home:viewHome,cards:viewCards,map:viewMap,quiz:viewQuiz,quizrun:viewQuizRun,order:viewOrder,read:viewRead}[S.view];
  $("#app").innerHTML=v();
}

/* ============ ACTIONS ============ */
const ACT={
  go(a){S.view=a; if(a==="map"){S.map.run=null;} render(); window.scrollTo(0,0);},
  goTopic(a){const [v,t]=a.split("|"); S.topic=t;
    if(v==="cards") newDeck();
    if(v==="map"){S.map.d=DIAGRAMS.find(d=>d.topic===t).id;S.map.mode="study";S.map.run=null;}
    if(v==="quiz"){startQuiz("normal"); render(); window.scrollTo(0,0); return;}
    S.view=v; render(); window.scrollTo(0,0);},
  say(a){say(a);},
  exam(){startQuiz("exam"); render(); window.scrollTo(0,0);},
  review(){startQuiz("review"); render(); window.scrollTo(0,0);},
  cardsTopic(a){S.topic=a; newDeck(); render();},
  dir(a){S.cardDir=a; S.cards.flip=false; render();},
  flip(){S.cards.flip=!S.cards.flip; render();},
  again(){const c=S.cards,x=c.queue.shift(); c.queue.splice(Math.min(3,c.queue.length),0,x); c.flip=false; render();},
  know(){const c=S.cards,x=c.queue.shift(); c.done++; c.flip=false; if(!store.known.includes(x[0])){store.known.push(x[0]);save();} render();},
  diag(a){S.map.d=a; S.map.run=null; S.map.sel=null; render();},
  mode(a){S.map.mode=a; S.map.run=null; S.map.sel=null; render();},
  mapAgain(){S.map.run=null; render();},
  mapNext(){const R=S.map.run; R.i++; R.answered=false; R.opts=null; R.pick=null; render();},
  pt(a){
    if(S.view==="map"){
      const M=S.map;
      if(M.mode==="study"){M.sel=a; say(a); render(); return;}
      if(M.mode!=="find") return;
      const R=M.run, target=R.order[R.i]; if(!target||R.answered) return;
      const ok=a===target; record(`pin:${M.d}:${target}`,ok);
      R.answered=true; R.lastOk=ok; if(ok){R.score++;R.marks[target]="ok";} else {R.marks[target]="bad";}
      if(ok){render(); setTimeout(()=>{if(S.map.run===R&&R.answered){ACT.mapNext();}},650); return;}
      render(); return;
    }
    if(S.view==="quizrun"){const Q=S.quiz,q=Q.items[Q.i]; if(!q||q.type!=="pin"||Q.answered) return; answer(a);}
  },
  mapPick(a){const R=S.map.run,target=R.order[R.i]; if(R.answered) return; const ok=a===target; record(`pin:${S.map.d}:${target}`,ok);
    R.answered=true; R.lastOk=ok; R.pick=a; if(ok)R.score++; R.marks[target]=ok?"ok":"bad"; render();},
  quizTopic(a){S.topic=a; render();},
  quizStart(){startQuiz("normal"); render(); window.scrollTo(0,0);},
  quizAgain(){startQuiz(S.quiz.mode); render(); window.scrollTo(0,0);},
  qPick(a){answer(a);},
  quizNext(){const Q=S.quiz; Q.i++; Q.answered=false; Q.pick=null; render(); window.scrollTo(0,0);},
  seq(a){newOrder(+a); render();},
  ordPick(a){S.order.picked.push(+a); render();},
  ordUndo(){S.order.picked.pop(); render();},
  ordCheck(){S.order.checked=true; render();},
  readTopic(a){S.topic=a; render();},
  reveal(a){S.revealed[a]=!S.revealed[a]; render();},
};
function answer(a){
  const Q=S.quiz,q=Q.items[Q.i]; if(Q.answered) return;
  const ok=a===q.a; Q.answered=true; Q.pick=a; Q.lastOk=ok; record(q.id,ok);
  if(ok) Q.score++; else Q.wrong.push(q);
  render();
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]"); if(!t) return; ACT[t.dataset.act]?.(t.dataset.arg,t,e);});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click?e.target.click():ACT[e.target.dataset.act]?.(e.target.dataset.arg);}});
document.addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.draft; if(id) S.drafts[id]=e.target.value;});
render();
</script>
<!--APP-END-->
